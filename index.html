<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>钢材重量计算器</title>
<style>
:root {
  --navy: #0f2a44; --navy-light: #1a3a5c;
  --orange: #e85d3a; --orange-light: #fef3ef;
  --gray-50: #f8f9fa; --gray-100: #edf0f5; --gray-200: #dde1e8;
  --gray-300: #c0c6d0; --gray-500: #8490a0; --gray-700: #4a5468;
  --gray-900: #1a1f2e;
  --green: #2d9a5e; --green-light: #edf7f2;
  --radius: 12px; --radius-sm: 8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:var(--gray-50);color:var(--gray-900);line-height:1.5;padding-bottom:80px}
.no-trans *,.no-trans *::before,.no-trans *::after{transition:none!important}

.header{background:var(--navy);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100}
.header h1{font-size:19px;font-weight:700;letter-spacing:.3px}
.header p{font-size:12px;opacity:.65;margin-top:2px}

.tabs{display:flex;background:var(--gray-100);padding:4px;margin:12px 16px;border-radius:var(--radius);flex-shrink:0;}
.tab{flex:1;text-align:center;padding:10px;font-size:14px;font-weight:600;border-radius:calc(var(--radius)-4px);
  cursor:pointer;transition:.2s;color:var(--gray-500);user-select:none;-webkit-tap-highlight-color:transparent}
.tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tab-cont{display:none;padding:0 16px}
.tab-cont.active{display:block}

.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{width:100%;padding:13px 16px;border:1.5px solid var(--gray-200);border-radius:var(--radius);
  font-size:16px;outline:none;transition:.2s;background:#fff}
.search-wrap input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,42,68,.12)}

.spec-list{max-height:220px;overflow-y:auto;background:#fff;border-radius:var(--radius-sm);
  border:1px solid var(--gray-200);margin-bottom:10px}
.spec-item{padding:11px 14px;font-size:14px;border-bottom:1px solid var(--gray-100);
  cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.spec-item:last-child{border-bottom:none}
.spec-item:active{background:var(--gray-100)}
.spec-item .s-name{flex:1}
.spec-item .s-cat{font-size:11px;color:var(--gray-500);background:var(--gray-100);padding:2px 8px;border-radius:10px;margin:0 8px;white-space:nowrap}
.spec-item .s-wgt{color:var(--gray-500);font-size:13px;white-space:nowrap}
.spec-empty{padding:24px;text-align:center;color:var(--gray-500);font-size:14px}

.sel-card{background:#fff;border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.08);padding:18px;margin-bottom:10px;transition:.2s}
.sel-card .sc-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}
.sel-card .sc-name{font-size:17px;font-weight:700;color:var(--navy)}
.sel-card .sc-meta{font-size:12px;color:var(--gray-500)}
.sel-card .sc-cat{font-size:11px;color:var(--gray-500);background:var(--gray-100);padding:3px 10px;border-radius:12px}
.input-row{display:flex;gap:12px;margin-bottom:10px}
.input-group{flex:1}
.input-group label{display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:4px}
.input-group input{width:100%;padding:11px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:17px;text-align:center;outline:none;transition:.15s}
.input-group input:focus{border-color:var(--navy)}
.result-line{display:flex;gap:0;margin-bottom:10px}
.result-line .rl-item{flex:1;text-align:center;padding:8px 0}
.result-line .rl-val{font-size:22px;font-weight:700;color:var(--orange)}
.result-line .rl-lbl{font-size:12px;color:var(--gray-500)}
.btn-row{display:flex;gap:10px}
.btn{flex:1;padding:12px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:.15s;text-align:center}
.btn:active{opacity:.85;transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:disabled{background:var(--gray-200);color:var(--gray-500);cursor:not-allowed;transform:none}
.btn-outline{background:var(--gray-100);color:var(--gray-700)}

/* Bottom summary bar */
.summary-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.1);
  z-index:200;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.summary-bar .sb-row{display:flex;justify-content:space-between;align-items:center}
.summary-bar .sb-total{font-size:13px;color:var(--gray-500)}
.summary-bar .sb-total strong{font-size:22px;color:var(--orange);margin-left:6px}
.summary-bar .sb-action{color:var(--gray-500);font-size:13px;cursor:pointer;padding:4px 8px}

/* Summary detail overlay */
.summary-detail{display:none;position:fixed;bottom:52px;left:0;right:0;background:#fff;
  border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.12);
  z-index:199;max-height:50vh;overflow-y:auto}
.summary-detail.show{display:block}
.sd-hd{padding:14px 16px 8px;font-size:14px;font-weight:700;color:var(--gray-700);display:flex;justify-content:space-between}
.sd-item{display:flex;padding:10px 16px;align-items:center;gap:8px;font-size:13px;border-top:1px solid var(--gray-100)}
.sd-item .sd-spec{flex:1;font-weight:500}
.sd-item .sd-wgt{color:var(--orange);font-weight:700}
.sd-item .sd-del{color:var(--gray-300);font-size:18px;cursor:pointer;padding:4px}
.sd-empty{padding:30px;text-align:center;color:var(--gray-500);font-size:14px}

/* Custom calc */
.sec{background:#fff;border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden}
.sec-hd{background:var(--navy);color:#fff;padding:12px 16px;font-size:14px;font-weight:600}
.sec-body{padding:14px 16px}
.sec .inp-row{display:grid;gap:10px;margin-bottom:10px}
.sec .inp-row.c2{grid-template-columns:1fr 1fr}
.sec .inp-row.c3{grid-template-columns:1fr 1fr 1fr}
.sec .inp-row.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.sec .ig label{display:block;font-size:11px;color:var(--gray-500);margin-bottom:2px}
.sec .ig input{width:100%;padding:9px 10px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:15px;text-align:center;outline:none}
.sec .ig input:focus{border-color:var(--navy)}
.sec-res{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
  background:var(--orange-light);border-radius:var(--radius-sm);margin-bottom:8px}
.sec-res .sr-lbl{font-size:13px;font-weight:600;color:var(--gray-700)}
.sec-res .sr-val{font-size:20px;font-weight:700;color:var(--orange)}
.sec-add{padding:11px;border:none;border-radius:var(--radius-sm);background:var(--gray-100);
  color:var(--gray-700);font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:.15s}
.sec-add:active{opacity:.7}
.sec-add:disabled{color:var(--gray-300);cursor:not-allowed}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--gray-900);
  color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;z-index:999;
  opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1>钢材重量计算器</h1>
  <p>搜规格 · 输长度 · 自动算重</p>
</div>

  <div class="tab active" data-tab="quick" onclick="switchTab('quick')">快速查重</div>
  <div class="tab" data-tab="custom" onclick="switchTab('custom')">自定义计算</div>
</div>

<div id="tab-quick" class="tab-cont active">
<div class="search-wrap">
  <input id="search" type="text" placeholder="搜索品类或规格名称（如 HN400、L50、D108）" autocomplete="off">
</div>
<div id="specList" class="spec-list" style="display:none"></div>
<div id="selCard" class="sel-card" style="display:none"></div>
</div>

<div id="tab-custom" class="tab-cont">
<div id="customSections"></div>
</div>

<!-- Summary bar -->
<div class="summary-bar" id="summaryBar" style="display:none">
  <div class="sb-row">
    <div class="sb-total">合计 <strong id="totalWeight">0.00</strong> kg</div>
    <div class="sb-action" id="sbToggle" onclick="toggleSummary()">查看明细 ▴</div>

</div>
<div class="summary-detail" id="summaryDetail">

  <div id="summaryList"></div>
  <div class="sd-empty" id="sdEmpty">暂无记录</div>
</div>

const CAT_NAMES = {HN:'窄翼缘H型钢(梁)',HM:'中翼缘H型钢(梁柱)',HW:'宽翼缘H型钢(柱)',
  HT:'薄壁H型钢(轻型)',ZH:'组焊H型钢(非标)',IB:'工字钢',CH:'槽钢',
  EA:'等边角钢',UA:'不等边角钢',PP:'钢管'};
const ALL_SPECS = [];
for (const [cat, specs] of Object.entries(DATA)) {
  for (const [name, kgm] of specs) ALL_SPECS.push({cat, name, kgm});
}

// ===================== STATE =====================
let items = [];
let curSel = null, lenVal = 0, qtyVal = 1;

// ===================== DOM =====================
const searchEl = document.getElementById('search');
const specListEl = document.getElementById('specList');
const selCardEl = document.getElementById('selCard');
const summaryBarEl = document.getElementById('summaryBar');
const summaryDetailEl = document.getElementById('summaryDetail');
const summaryListEl = document.getElementById('summaryList');
const totalWeightEl = document.getElementById('totalWeight');
const sdEmptyEl = document.getElementById('sdEmpty');
const toastEl = document.getElementById('toast');

// ===================== CUSTOM CALC =====================
const CUSTOM_SECS = [
  {title:'焊接H型钢(组焊)', keys:['h','b','tw','tf','l','q'],
   labels:['腹板高H(mm)','翼缘宽B(mm)','腹板厚tw(mm)','翼缘厚tf(mm)','长度(m)','数量(根)'], cols:3,
   calc:v=>v.h&&v.b&&v.tw&&v.tf&&v.l?((v.h-2*v.tf)*v.tw+2*v.b*v.tf)*7.85/1000*v.l*(v.q||1):null,
   labelFn:v=>`焊接H${v.h}x${v.b}x${v.tw}x${v.tf} L=${v.l}`},
  {title:'方管/矩形管', keys:['a','b','t','l','q'],
   labels:['边长A(mm)','边长B(mm)','壁厚t(mm)','长度(m)','数量(根)'], cols:3,
   calc:v=>v.a&&v.b&&v.t&&v.l?(v.a+v.b)*2*v.t*v.l*(v.q||1)*0.00785:null,
   labelFn:v=>`方管${v.a}x${v.b}x${v.t} L=${v.l}`},
  {title:'圆管(自定义)', keys:['d','t','l','q'],
   labels:['外径D(mm)','壁厚t(mm)','长度(m)','数量(根)'], cols:2,
   calc:v=>v.d&&v.t&&v.l?Math.PI*(v.d-v.t)*v.t*v.l*(v.q||1)*0.00785:null,
   labelFn:v=>`圆管D${v.d}x${v.t} L=${v.l}`},
  {title:'角钢(自定义)', keys:['a','b','t','l','q'],
   labels:['边宽A(mm)','边宽B(mm)','边厚t(mm)','长度(m)','数量(根)'], cols:3,
   calc:v=>v.a&&v.b&&v.t&&v.l?(v.a+v.b-v.t)*v.t*v.l*(v.q||1)*0.00785:null,
   labelFn:v=>`角钢${v.a}x${v.b}x${v.t} L=${v.l}`},
  {title:'钢板', keys:['l2','w','t','q'],
   labels:['长度(m)','宽度(m)','厚度(mm)','数量(块)'], cols:2,
   calc:v=>v.l2&&v.w&&v.t?v.l2*v.w*v.t*(v.q||1)*7.85:null,
   labelFn:v=>`钢板${v.l2}x${v.w}x${v.t}`},
];

function renderCustomSections() {
  document.getElementById('customSections').innerHTML = CUSTOM_SECS.map((sec, si) =>
    `<div class="sec">
      <div class="sec-hd">${sec.title}</div>
      <div class="sec-body">
        <div class="inp-row c${sec.cols}">${sec.keys.map((key, fi) =>
          `<div class="ig"><label>${sec.labels[fi]}</label>
            <input type="number" step="any" min="0" id="cs_${si}_${key}" placeholder="0" oninput="calcCustom(${si})">
          </div>`
        ).join('')}</div>
        <div class="sec-res">
          <span class="sr-lbl">计算结果</span>
          <span class="sr-val" id="cs_res_${si}">—</span>
        </div>
        <button class="sec-add" id="cs_add_${si}" disabled onclick="addCustomFromSec(${si})">+ 加入计算明细</button>
      </div>
    </div>`
  ).join('');
  window._csv = CUSTOM_SECS.map(() => ({}));
}

function calcCustom(si) {
  const sec = CUSTOM_SECS[si];
  const vals = {};
  for (const key of sec.keys) {
    const el = document.getElementById(`cs_${si}_${key}`);
    const v = parseFloat(el.value);
    vals[key] = isNaN(v) ? 0 : v;
  }
  const res = sec.calc(vals);
  document.getElementById(`cs_res_${si}`).textContent = res !== null ? res.toFixed(1) + ' kg' : '—';
  document.getElementById(`cs_add_${si}`).disabled = res === null || res <= 0;
  window._csv[si] = {vals, res, label: res !== null ? sec.labelFn(vals) : ''};
}

function addCustomFromSec(si) {
  const data = window._csv[si];
  if (!data || data.res === null || data.res <= 0) return;
  addCustomItem(data.label, data.res);
}

// ===================== INIT =====================
document.body.classList.add('no-trans');
init();
requestAnimationFrame(() => document.body.classList.remove('no-trans'));

function init() {
  renderCustomSections();
  searchEl.addEventListener('input', onSearch);
}

// ===================== SEARCH (ALL CATEGORIES) =====================
function onSearch() {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { specListEl.style.display = 'none'; return; }
  const matched = ALL_SPECS.filter(s => s.name.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q));
  if (matched.length === 0) {
    specListEl.innerHTML = '<div class="spec-empty">未匹配到规格，试试其他关键词</div>';
  } else {
    specListEl.innerHTML = matched.slice(0, 50).map(s =>
      `<div class="spec-item" onclick="selectSpec('${s.cat}','${s.name.replace(/'/g,"\\'")}',${s.kgm})">
        <span class="s-name">${s.name}</span>
        <span class="s-cat">${s.cat}</span>
        <span class="s-wgt">${s.kgm.toFixed(1)} kg/m</span>
      </div>`
    ).join('');
  }
  specListEl.style.display = 'block';
}

// ===================== SPEC SELECTION =====================
function selectSpec(cat, name, kgm) {
  curSel = {cat, name, kgm};
  lenVal = 0; qtyVal = 1;
  specListEl.style.display = 'none';
  searchEl.value = name;
  renderSelCard();
  selCardEl.style.display = 'block';
}
function renderSelCard() {
  if (!curSel) { selCardEl.style.display = 'none'; return; }
  selCardEl.innerHTML = `
    <div class="sc-top">
      <div>
        <div class="sc-name">${curSel.name}</div>
        <div class="sc-meta">米重 ${curSel.kgm.toFixed(1)} kg/m</div>
      </div>
      <span class="sc-cat">${curSel.cat}</span>
    </div>
    <div class="input-row">
      <div class="input-group"><label>长度 (m)</label>
        <input type="number" step="0.1" min="0" value="" placeholder="0"
          oninput="onLenChange(this.value)"></div>
      <div class="input-group"><label>数量 (根)</label>
        <input type="number" step="1" min="1" value="1" oninput="onQtyChange(this.value)"></div>
    </div>
    <div class="result-line">
      <div class="rl-item"><div class="rl-val" id="card_single">0.0</div><div class="rl-lbl">kg/根</div></div>
      <div class="rl-item"><div class="rl-val" id="card_total">0.0</div><div class="rl-lbl">合计 (kg)</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="card_add_btn" onclick="addItem()" disabled>+ 加入明细</button>
      <button class="btn btn-outline" onclick="cancelSel()">取消</button>
    </div>`;
}
function updateCardResults() {
  if (!curSel) return;
  const kgm = curSel.kgm, len = lenVal || 0, qty = qtyVal || 1;
  const elS = document.getElementById('card_single');
  const elT = document.getElementById('card_total');
  const elBtn = document.getElementById('card_add_btn');
  if (elS) elS.textContent = (kgm * len).toFixed(1);
  if (elT) elT.textContent = (kgm * len * qty).toFixed(1);
  if (elBtn) elBtn.disabled = !lenVal || lenVal <= 0;
}
function onLenChange(v) { lenVal = parseFloat(v) || 0; updateCardResults(); }
function onQtyChange(v) { qtyVal = parseInt(v) || 1; updateCardResults(); }
function cancelSel() { curSel = null; selCardEl.style.display = 'none'; searchEl.value = ''; specListEl.style.display = 'none'; }

// ===================== ADD / REMOVE / CLEAR =====================
function addItem() {
  if (!curSel) return;
  var len = parseFloat(lenVal) || 0;
  if (len <= 0) return;
  var qty = parseInt(qtyVal) || 1;
  var total = curSel.kgm * len * qty;
  items.push({
    spec: curSel.name, cat: curSel.cat, kgm: curSel.kgm,
    len: len, qty: qty, total: total
  });
  updateSummary();
  var btn = document.getElementById('card_add_btn');
  if (btn) {
    btn.textContent = '\u2714 \u5df2\u52a0\u5165';
    btn.disabled = true;
    btn.style.background = '#2d9a5e';
    setTimeout(function() {
      btn.textContent = '+ \u52a0\u5165\u660e\u7ec6';
      btn.disabled = false;
      btn.style.background = '';
    }, 900);
  }
  showToast('\u2714 \u5df2\u52a0\u5165\u660e\u7ec6');
}
function addCustomItem(label, totalW) {
  if (!totalW || totalW <= 0) return;
  items.push({
    spec: label, cat: '\u81ea\u5b9a\u4e49', kgm: null, len: null, qty: 1, total: totalW
  });
  updateSummary();
  showToast('\u2714 \u5df2\u52a0\u5165\u660e\u7ec6');
}
function removeItem(idx) { items.splice(idx, 1); updateSummary(); }
function clearAll() { items = []; updateSummary(); }

function updateSummary() {
  if (items.length > 0) {
    summaryBarEl.style.display = 'block';
    const total = items.reduce((s, it) => s + it.total, 0);
    totalWeightEl.textContent = total.toFixed(1);
    summaryListEl.innerHTML = items.map((it, i) =>
      `<div class="sd-item">
        <span class="sd-spec">${it.spec}</span>
        <span class="sd-wgt">${it.total.toFixed(1)} kg</span>
        <span class="sd-del" onclick="removeItem(${i})">✕</span>
      </div>`
    ).join('');
    sdEmptyEl.style.display = 'none';
  } else {
    summaryBarEl.style.display = 'none';
    summaryDetailEl.classList.remove('show');
  }
}
function toggleSummary() {
  if (items.length === 0) return;
  summaryDetailEl.classList.toggle('show');
  document.getElementById('sbToggle').textContent =
    summaryDetailEl.classList.contains('show') ? '收起 ▾' : '查看明细 ▴';
}

// ===================== TABS =====================
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-cont').forEach(t => t.classList.toggle('active', t.id === 'tab-'+name));
  if (summaryDetailEl.classList.contains('show')) toggleSummary();
}


</script>
</body>
