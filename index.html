<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>钢材重量计算器</title>
<style>
:root {
  --navy: #0f2a44; --navy-light: #1a3a5c;
  --orange: #e85d3a; --orange-light: #fef3ef;
  --gray-50: #f8f9fa; --gray-100: #edf0f5; --gray-200: #dde1e8;
  --gray-300: #c0c6d0; --gray-500: #8490a0; --gray-700: #4a5468;
  --gray-900: #1a1f2e;
  --green: #2d9a5e; --green-light: #edf7f2;
  --radius: 12px; --radius-sm: 8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:var(--gray-50);color:var(--gray-900);line-height:1.5;padding-bottom:80px}
.no-trans *,.no-trans *::before,.no-trans *::after{transition:none!important}

.header{background:var(--navy);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100}
.header h1{font-size:19px;font-weight:700;letter-spacing:.3px}
.header p{font-size:12px;opacity:.65;margin-top:2px}

.tabs{display:flex;background:var(--gray-100);padding:4px;margin:12px 16px;border-radius:var(--radius);flex-shrink:0;}
.tab{flex:1;text-align:center;padding:10px;font-size:14px;font-weight:600;border-radius:calc(var(--radius)-4px);
  cursor:pointer;transition:.2s;color:var(--gray-500);user-select:none;-webkit-tap-highlight-color:transparent}
.tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tab-cont{display:none;padding:0 16px}
.tab-cont.active{display:block}

.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{width:100%;padding:13px 16px;border:1.5px solid var(--gray-200);border-radius:var(--radius);
  font-size:16px;outline:none;transition:.2s;background:#fff}
.search-wrap input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,42,68,.12)}

.spec-list{max-height:360px;overflow-y:auto;background:#fff;border-radius:var(--radius-sm);
  border:1px solid var(--gray-200);margin-bottom:10px}
.spec-item{padding:11px 14px;font-size:14px;border-bottom:1px solid var(--gray-100);
  cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.spec-item:last-child{border-bottom:none}
.spec-item:active{background:var(--gray-100)}
.spec-item .s-name{flex:1}
.spec-item .s-cat{font-size:11px;color:var(--gray-500);background:var(--gray-100);padding:2px 8px;border-radius:10px;margin:0 8px;white-space:nowrap}
.spec-item .s-wgt{color:var(--gray-500);font-size:13px;white-space:nowrap}
.spec-empty{padding:24px;text-align:center;color:var(--gray-500);font-size:14px}

.cat-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.cat-tag{padding:6px 12px;background:#fff;border:1.5px solid var(--gray-200);border-radius:16px;
  font-size:12px;font-weight:500;cursor:pointer;color:var(--gray-700);transition:.15s;
  white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.cat-tag:active{background:var(--gray-100);transform:scale(.96)}
.cat-tag.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.sel-card{background:#fff;border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.08);padding:18px;margin-bottom:10px;transition:.2s}
.sel-card .sc-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}
.sel-card .sc-name{font-size:17px;font-weight:700;color:var(--navy)}
.sel-card .sc-meta{font-size:12px;color:var(--gray-500)}
.sel-card .sc-cat{font-size:11px;color:var(--gray-500);background:var(--gray-100);padding:3px 10px;border-radius:12px}
.input-row{display:flex;gap:12px;margin-bottom:10px}
.input-group{flex:1}
.input-group label{display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:4px}
.input-group input{width:100%;padding:11px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:17px;text-align:center;outline:none;transition:.15s}
.input-group input:focus{border-color:var(--navy)}
.result-line{display:flex;gap:0;margin-bottom:10px}
.result-line .rl-item{flex:1;text-align:center;padding:8px 0}
.result-line .rl-val{font-size:22px;font-weight:700;color:var(--orange)}
.result-line .rl-lbl{font-size:12px;color:var(--gray-500)}
.btn-row{display:flex;gap:10px}
.btn{flex:1;padding:12px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:.15s;text-align:center}
.btn:active{opacity:.85;transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:disabled{background:var(--gray-200);color:var(--gray-500);cursor:not-allowed;transform:none}
.btn-outline{background:var(--gray-100);color:var(--gray-700)}

/* Bottom summary bar */
.summary-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.1);
  z-index:200;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.summary-bar .sb-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.summary-bar .sb-total{font-size:13px;color:var(--gray-700);text-align:left}
.summary-bar .sb-total strong{font-size:22px;color:var(--orange);margin-left:4px}
.sb-copy{justify-self:center;padding:7px 18px;border:none;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;transition:.15s;white-space:nowrap}
.sb-copy:active{opacity:.8}
.sb-copy.green{background:var(--green)}
.summary-bar .sb-action{color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px;text-align:right;white-space:nowrap}

/* Summary detail overlay */
.summary-detail{display:none;position:fixed;bottom:52px;left:0;right:0;background:#fff;
  border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.12);
  z-index:199;max-height:50vh;overflow-y:auto}
.summary-detail.show{display:block}
.sd-hd{padding:14px 16px 8px;font-size:14px;font-weight:700;color:var(--gray-700);display:flex;justify-content:space-between;align-items:center}
.sd-btn{display:block;width:fit-content;margin:10px auto;padding:8px 24px;border:none;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;background:var(--gray-100);color:var(--gray-700);transition:.15s}
.sd-btn:active{opacity:.8}
.sd-btn.green{background:var(--green);color:#fff}
.sd-item{display:flex;padding:10px 16px;align-items:center;gap:8px;font-size:13px;border-top:1px solid var(--gray-100)}
.sd-item .sd-spec{flex:1;font-weight:500}
.sd-item .sd-wgt{color:var(--orange);font-weight:700}
.sd-item .sd-del{color:var(--gray-300);font-size:18px;cursor:pointer;padding:4px}
.sd-empty{padding:30px;text-align:center;color:var(--gray-500);font-size:14px}

/* Custom calc */
.sec{background:#fff;border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden}
.sec-hd{background:var(--navy);color:#fff;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;-webkit-tap-highlight-color:transparent}
.sec-hd:active{opacity:.85}
.sec-icon{font-size:12px;transition:transform .2s;color:rgba(255,255,255,.7)}
.sec-body{padding:14px 16px}
.sec-body.hide{display:none}
.sec-body{padding:14px 16px}
.sec .inp-row{display:grid;gap:10px;margin-bottom:10px}
.sec .inp-row.c2{grid-template-columns:1fr 1fr}
.sec .inp-row.c3{grid-template-columns:1fr 1fr 1fr}
.sec .inp-row.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.sec .ig label{display:block;font-size:11px;color:var(--gray-500);margin-bottom:2px}
.sec .ig input{width:100%;padding:9px 10px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:15px;text-align:center;outline:none}
.sec .ig input:focus{border-color:var(--navy)}
.sec-res{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
  background:var(--orange-light);border-radius:var(--radius-sm);margin-bottom:8px}
.sec-res .sr-lbl{font-size:13px;font-weight:600;color:var(--gray-700)}
.sec-res .sr-val{font-size:20px;font-weight:700;color:var(--orange)}
.sec-add{padding:11px;border:none;border-radius:var(--radius-sm);background:var(--gray-100);
  color:var(--gray-700);font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:.15s}
.sec-add:active{opacity:.7}
.sec-add:disabled{color:var(--gray-300);cursor:not-allowed}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--gray-900);
  color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;z-index:999;
  opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.hdr-main{display:flex;align-items:center;gap:10px}
.hdr-logo{height:36px;width:auto;border-radius:4px}
.hdr-title h1{font-size:18px;line-height:1.2}
.hdr-title p{font-size:11px;opacity:.65;margin-top:2px}
.hdr-btn{background:var(--orange);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.hdr-btn:active{opacity:.85;transform:scale(.97)}

/* 项目委托 modal */
.entrust-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;
  align-items:center;justify-content:center}
.entrust-overlay.show{display:flex}
.entrust-modal{background:#fff;border-radius:var(--radius);width:70vw;max-width:500px;max-height:70vh;
  overflow-y:auto;padding:28px 22px 22px;position:relative;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.em-close{position:absolute;top:10px;right:14px;font-size:20px;color:var(--gray-300);cursor:pointer;line-height:1}
.em-logo{margin-bottom:14px}
.em-logo img{height:50px}
.em-text{font-size:14px;color:var(--gray-700);line-height:1.8;margin-bottom:20px}
.em-btns{display:flex;gap:12px;justify-content:center}
.em-btn{flex:1;max-width:160px;padding:12px 0;border:none;border-radius:var(--radius-sm);
  font-size:15px;font-weight:600;cursor:pointer;transition:.15s;color:#fff}
.em-btn:active{opacity:.85;transform:scale(.97)}
.em-btn-bid{background:var(--navy)}
.em-btn-inquiry{background:var(--orange)}

/* 图片预览弹窗 */
.img-popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;
  flex-direction:column;align-items:center;justify-content:center}
.img-popup-overlay.show{display:flex}
.img-popup-box{display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:90vw}
.img-popup-box img{border-radius:var(--radius);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.img-popup-box.scale-down img{width:70%;height:auto}
.img-popup-box.scale-up img{width:200%;height:auto}
.img-popup-box img:not(.scale-down):not(.scale-up){max-width:80vw;max-height:80vh}
.img-popup-caption{color:#fff;font-size:16px;font-weight:600;margin-top:12px;text-align:center}
.img-popup-close{position:fixed;top:16px;right:16px;width:36px;height:36px;
  background:#fff;color:var(--gray-900);border:2px solid rgba(0,0,0,.15);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  font-weight:700;cursor:pointer;z-index:1001;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>
</head>

<div class="header">
  <div class="hdr-main">
    <img class="hdr-logo" src="images.png" alt="logo" onerror="this.style.display='none'">
    <div class="hdr-title">
      <h1>钢材重量计算器</h1>
      <p>搜规格 · 输长度 · 自动算重</p>
    </div>
  </div>
  <button class="hdr-btn" onclick="openEntrust()">项目委托</button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="quick" onclick="switchTab('quick')">快速计算</div>

</div>

<div id="tab-quick" class="tab-cont active">
<div class="search-wrap">

<div id="specList" class="spec-list" style="display:none"></div>
<div id="selCard" class="sel-card" style="display:none"></div>

<div id="tab-custom" class="tab-cont">
<div id="customSections"></div>
</div>

<div class="summary-bar" id="summaryBar" style="display:none">

</div>
<div class="summary-detail" id="summaryDetail">

// ===================== CUSTOM CALC =====================
const CUSTOM_SECS = [
  {title:'BH 组焊H型钢', keys:['h','b','tw','tf','l','q'],
   labels:['腹板高H(mm)','翼缘宽B(mm)','腹板厚tw(mm)','翼缘厚tf(mm)','长度(m)','数量(根)'], cols:3,
   dflt:[300,200,8,12,12,1],
   calc:v=>v.h&&v.b&&v.tw&&v.tf&&v.l?((v.h-2*v.tf)*v.tw+2*v.b*v.tf)*7.85/1000*v.l*(v.q||1):null,
   labelFn:v=>`BH${v.h}x${v.b}x${v.tw}x${v.tf} L=${v.l} N=${v.q||1}`},
  {title:'RHS 方矩管', keys:['a','b','t','l','q'],
   labels:['边长A(mm)','边长B(mm)','壁厚t(mm)','长度(m)','数量(根)'], cols:3,
   dflt:[100,100,4,12,1],
   calc:v=>v.a&&v.b&&v.t&&v.l?(v.a+v.b)*2*v.t*v.l*(v.q||1)*0.00785:null,
   labelFn:v=>(v.a==v.b?'SHS':'RHS')+v.a+'x'+v.b+'x'+v.t+' L='+v.l+' N='+(v.q||1)},
  {title:'CHS 圆管', keys:['d','t','l','q'],
   labels:['外径D(mm)','壁厚t(mm)','长度(m)','数量(根)'], cols:2,
   dflt:[100,4,12,1],
   calc:v=>v.d&&v.t&&v.l?Math.PI*(v.d-v.t)*v.t*v.l*(v.q||1)*0.00785:null,
   labelFn:v=>`CHS${v.d}x${v.t} L=${v.l} N=${v.q||1}`},
  {title:'L 角钢', keys:['a','b','t','l','q'],
   labels:['边宽A(mm)','边宽B(mm)','边厚t(mm)','长度(m)','数量(根)'], cols:3,
   dflt:[50,50,5,12,1],
   calc:v=>v.a&&v.b&&v.t&&v.l?(v.a+v.b-v.t)*v.t*v.l*(v.q||1)*0.00785:null,

   labelFn:v=>`L${v.a}x${v.b}x${v.t} L=${v.l} N=${v.q||1}`},
  {title:'PL 钢板', keys:['w','l2','t','q'],
   labels:['宽度(mm)','长度(m)','厚度(mm)','数量(块)'], cols:2,
   dflt:[1000,2,10,1],
   calc:v=>v.l2&&v.w&&v.t?v.l2*v.w/1000*v.t*(v.q||1)*7.85:null,
   labelFn:v=>`PL${v.w}x${(v.l2*1000).toFixed(0)}x${v.t} N=${v.q||1}`},
  {title:'FL 扁钢', keys:['w','t','l','q'],
   labels:['宽度(mm)','厚度(mm)','长度(m)','数量(根)'], cols:2,
   dflt:[50,5,12,1],
   calc:v=>v.w&&v.t&&v.l?v.w*v.t*7.85/1000*v.l*(v.q||1):null,
   labelFn:v=>`FL${v.w}x${v.t} L=${v.l} N=${v.q||1}`},
  {title:'RB 圆钢', keys:['d','l','q'],
   labels:['直径(mm)','长度(m)','数量(根)'], cols:3,
   dflt:[20,12,1],
   calc:v=>v.d&&v.l?v.d*v.d*0.006165*v.l*(v.q||1):null,

];

function renderCustomSections() {
  document.getElementById('customSections').innerHTML = CUSTOM_SECS.map((sec, si) =>
    `<div class="sec">
      <div class="sec-hd" onclick="toggleSec(${si})">
        <span>${sec.title}</span>
        <span class="sec-icon" id="cs_icon_${si}">▶</span>
      </div>
      <div class="sec-body hide" id="cs_body_${si}">
        <div class="inp-row c${sec.cols}">${sec.keys.map((key, fi) =>
          `<div class="ig"><label>${sec.labels[fi]}</label>
            <input type="number" step="any" min="0" id="cs_${si}_${key}" value="${sec.dflt[fi]}" oninput="calcCustom(${si})" onfocus="this.value='';calcCustom(${si})" placeholder="${sec.dflt[fi]}">
          </div>`
        ).join('')}</div>
        <div class="sec-res">
          <span class="sr-lbl">计算结果</span>
          <span class="sr-val" id="cs_res_${si}">—</span>
        </div>
        <button class="sec-add" id="cs_add_${si}" disabled>+ 加入明细</button>
      </div>
    </div>`
  ).join('');
  window._csv = CUSTOM_SECS.map(() => ({}));
}

function calcCustom(si) {
  const sec = CUSTOM_SECS[si];
  const vals = {};
  for (const key of sec.keys) {
    const el = document.getElementById(`cs_${si}_${key}`);
    const v = parseFloat(el.value);
    vals[key] = isNaN(v) ? 0 : v;
  }
  const res = sec.calc(vals);
  document.getElementById(`cs_res_${si}`).textContent = res !== null ? res.toFixed(1) + ' kg' : '—';
  document.getElementById(`cs_add_${si}`).disabled = res === null || res <= 0;
  window._csv[si] = {vals, res, label: res !== null ? sec.labelFn(vals) : ''};
}

function addCustomFromSec(si) {
  const data = window._csv[si];
  if (!data || data.res === null || data.res <= 0) return;
  addCustomItem(data.label, data.res);
  var btn = document.getElementById('cs_add_' + si);
  if (!btn) return;
  btn.textContent = '\u2714 \u5df2\u52a0\u5165';
  btn.disabled = true;
  btn.style.background = '#2d9a5e';
  btn.style.color = '#fff';
  setTimeout(function() {
    btn.textContent = '+ \u52a0\u5165\u660e\u7ec6';
    btn.disabled = false;
    btn.style.background = '';
    btn.style.color = '';
  }, 900);
}

function toggleSec(si) {
  var body = document.getElementById('cs_body_' + si);
  var icon = document.getElementById('cs_icon_' + si);
  if (!body || !icon) return;
  var isOpen = !body.classList.contains('hide');
  body.classList.toggle('hide');
  icon.textContent = isOpen ? '▶' : '▼';
}

// ===================== INIT =====================
document.body.classList.add('no-trans');
init();
requestAnimationFrame(() => document.body.classList.remove('no-trans'));

function init() {
  renderCustomSections();
  for (var i = 0; i < CUSTOM_SECS.length; i++) {
    (function(idx) {
      var btn = document.getElementById('cs_add_' + idx);
      if (btn) btn.onclick = function() { addCustomFromSec(idx); };
    })(i);
  }
  renderCatTags();
  searchEl.addEventListener('input', onSearch);
  for (var i = 0; i < CUSTOM_SECS.length; i++) calcCustom(i);
}

// ===================== CATEGORY QUICK TAGS =====================
function renderCatTags() {
  var cats = Object.keys(CAT_SORT).sort(function(a,b){return CAT_SORT[a]-CAT_SORT[b];});
  document.getElementById('catTags').innerHTML = cats.map(function(c){
    var label = (CAT_NAMES[c]||c).split('(')[0];
    return '<div class="cat-tag" data-cat="'+c+'" onclick="showCatSpecs(\''+c+'\')" onmousedown="event.preventDefault()">'+c+' '+label+'</div>';
  }).join('');
}
function showCatSpecs(cat) {
  var tag = document.querySelector('.cat-tag[data-cat="'+cat+'"]');
  if (tag && tag.classList.contains('active')) {
    tag.classList.remove('active');
    specListEl.style.display = 'none';
    return;
  }
  document.querySelectorAll('.cat-tag').forEach(function(t){t.classList.remove('active');});
  if (tag) tag.classList.add('active');
  var specs = ALL_SPECS.filter(function(s){return s.cat===cat;});
  specListEl.innerHTML = specs.map(function(s){
    return '<div class="spec-item" onclick="selectSpec(\''+s.cat+'\',\''+s.name.replace(/'/g,"\\'")+'\','+s.kgm+')"><span class="s-name">'+s.name+'</span><span class="s-wgt">'+s.kgm.toFixed(1)+' kg/m</span></div>';
  }).join('');
  specListEl.style.display = 'block';
}

// ===================== SEARCH (ALL CATEGORIES) =====================
function onSearch() {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { specListEl.style.display = 'none'; document.querySelectorAll('.cat-tag').forEach(function(t){t.classList.remove('active');}); return; }
  document.querySelectorAll('.cat-tag').forEach(function(t){t.classList.remove('active');});
  const matched = ALL_SPECS.filter(s => s.name.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q) || (CAT_NAMES[s.cat]||'').toLowerCase().includes(q));
  matched.sort((a,b) => (CAT_SORT[a.cat]||99) - (CAT_SORT[b.cat]||99) || a.kgm - b.kgm);
  if (matched.length === 0) {
    specListEl.innerHTML = '<div class="spec-empty">未匹配到规格，试试其他关键词</div>';
  } else {
    specListEl.innerHTML = matched.slice(0, 50).map(s => {
      var cn = (CAT_NAMES[s.cat]||s.cat).replace(/\(.*\)/,'');
      return `<div class="spec-item" onclick="selectSpec('${s.cat}','${s.name.replace(/'/g,"\\'")}',${s.kgm})">
        <span class="s-name">${cn} ${s.name}</span>
        <span class="s-cat">${s.cat}</span>
        <span class="s-wgt">${s.kgm.toFixed(1)} kg/m</span>
      </div>`
    }).join('');
  }
  specListEl.style.display = 'block';
}

// ===================== SPEC SELECTION =====================
function selectSpec(cat, name, kgm) {
  curSel = {cat, name, kgm};
  lenVal = 12; qtyVal = 1;

  updateCardResults();
  selCardEl.style.display = 'block';

function renderSelCard() {
  if (!curSel) { selCardEl.style.display = 'none'; return; }

    <div class="sc-top">
      <div>

function updateCardResults() {
  if (!curSel) return;
  const kgm = curSel.kgm, len = lenVal || 0, qty = qtyVal || 1;
  const elS = document.getElementById('card_single');
  const elT = document.getElementById('card_total');
  const elBtn = document.getElementById('card_add_btn');
  if (elS) elS.textContent = (kgm * len).toFixed(1);
  if (elT) elT.textContent = (kgm * len * qty).toFixed(1);
  if (elBtn) elBtn.disabled = !lenVal || lenVal <= 0;
}
function onLenChange(v) { lenVal = parseFloat(v) || 0; updateCardResults(); }
function onQtyChange(v) { qtyVal = parseInt(v) || 1; updateCardResults(); }
function cancelSel() { curSel = null; selCardEl.style.display = 'none'; searchEl.value = ''; specListEl.style.display = 'none'; document.querySelectorAll('.cat-tag').forEach(function(t){t.classList.remove('active');}); }

// ===================== ADD / REMOVE / CLEAR =====================
function addItem() {
  if (!curSel) return;
  var len = parseFloat(lenVal) || 0;
  if (len <= 0) return;
  var qty = parseInt(qtyVal) || 1;
  var total = curSel.kgm * len * qty;
  items.push({
    spec: curSel.name, cat: curSel.cat, kgm: curSel.kgm,
    len: len, qty: qty, total: total
  });
  updateSummary();
  var btn = document.getElementById('card_add_btn');
  if (btn) {
    btn.textContent = '\u2714 \u5df2\u52a0\u5165';
    btn.disabled = true;
    btn.style.background = '#2d9a5e';
    setTimeout(function() {
      btn.textContent = '+ \u52a0\u5165\u660e\u7ec6';
      btn.disabled = false;
      btn.style.background = '';
    }, 900);
  }
}
function addCustomItem(label, totalW) {
  if (!totalW || totalW <= 0) return;
  items.push({
    spec: label, cat: '\u81ea\u5b9a\u4e49', kgm: null, len: null, qty: 1, total: totalW
  });
  updateSummary();
}
function removeItem(idx) { items.splice(idx, 1); updateSummary(); }
function clearAll() { items = []; updateSummary(); }

function updateSummary() {
  if (items.length > 0) {
    summaryBarEl.style.display = 'block';
    const total = items.reduce((s, it) => s + it.total, 0);
    totalWeightEl.textContent = total.toFixed(1);
    summaryListEl.innerHTML = items.map((it, i) => {
      var detail = it.spec;
      if (it.len != null) detail += ' L=' + it.len + ' N=' + it.qty;
      return '<div class="sd-item">' +
        '<span class="sd-spec">' + detail + '</span>' +
        '<span class="sd-wgt">' + it.total.toFixed(1) + ' kg</span>' +
        '<span class="sd-del" onclick="removeItem(' + i + ')">✕</span>' +
      '</div>';
    }).join('');
    sdEmptyEl.style.display = 'none';
  } else {
    summaryBarEl.style.display = 'none';
    summaryDetailEl.classList.remove('show');
  }
}
function copyDetail() {
  if (items.length === 0) return;
  var btn = document.getElementById('copyBtn');
  btn.classList.add('green');
  btn.textContent = '已复制';
  setTimeout(function() { btn.classList.remove('green'); btn.textContent = '复制明细'; }, 1500);
  var lines = items.map(function(it) {
    var name = it.spec.replace(/\([^)]*\)/g, '').trim();
    if (it.len != null) name += ' L=' + it.len + ' N=' + it.qty;
    return name + '  ' + it.total.toFixed(1) + ' kg';
  });
  var total = items.reduce(function(s, it) { return s + it.total; }, 0);
  lines.push('---');
  lines.push('合计: ' + total.toFixed(1) + ' kg');
  navigator.clipboard.writeText(lines.join('\n')).then(function() {
    showToast('已复制明细到剪贴板');
  }).catch(function() {
    showToast('复制失败，请手动复制');
  });
}
function toggleSummary() {
  if (items.length === 0) return;
  summaryDetailEl.classList.toggle('show');
  document.getElementById('sbToggle').textContent =
    summaryDetailEl.classList.contains('show') ? '收起 ▾' : '查看明细 ▴';
}

}

}
function closeImgPopup() {
  document.getElementById('imgPopupOverlay').classList.remove('show');
}

</script>

<!-- 项目委托弹窗 -->
<div class="entrust-overlay" id="entrustOverlay" onclick="closeEntrust(event)">
  <div class="entrust-modal" onclick="event.stopPropagation()">
    <div class="em-close" onclick="closeEntrust()">✕</div>
    <div class="em-logo">
      <img src="images.png" alt="logo" onerror="this.style.display='none'">
    </div>
    <div class="em-text">省属大型综合建投国企，承建房建市政公路各类重点工程<br>集投资建设、开发运营、低碳环保、工程服务一体化发展</div>
    <div class="em-btns">
      <button class="em-btn em-btn-bid" onclick="showImagePopup('公众号.png')">公开招标</button>
      <button class="em-btn em-btn-inquiry" onclick="showImagePopup('个人.png')">询价采购</button>
    </div>
  </div>
</div>

<!-- 图片预览弹窗 -->
<div class="img-popup-overlay" id="imgPopupOverlay" onclick="closeImgPopup()">
  <div class="img-popup-close" onclick="closeImgPopup()">✕</div>
  <div class="img-popup-box" id="imgPopupBox" onclick="event.stopPropagation()">
    <img id="imgPopupImg" src="" alt="">
    <div class="img-popup-caption" id="imgPopupCaption" style="display:none">山西建投公众号</div>
  </div>
</div>
